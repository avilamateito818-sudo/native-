<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel Admin — Native Origen</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">

  <header class="admin__nav">
    <a href="index.html" class="brand">
      <span class="brand__mark">B</span>
      <span class="brand__name">Native<span>·</span>Origen</span>
    </a>
    <a href="index.html" class="admin__back">← Volver a la tienda</a>
  </header>

  <main class="admin__main">

    <!-- ============ LOGIN ============ -->
    <section class="login" id="login-view">
      <div class="login__card">
        <span class="login__badge" aria-hidden="true">🔐</span>
        <span class="section__tag">Acceso restringido</span>
        <h1>Panel Admin</h1>
        <p>Solo para el personal autorizado de Native Origen.</p>
        <form id="login-form">
          <input type="text" name="usuario" placeholder="Usuario" aria-label="Usuario" autocomplete="username" required />
          <input type="password" name="contrasena" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required />
          <p class="login__err" id="login-err" role="alert"></p>
          <button class="btn btn--gold" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </section>

    <!-- ============ DASHBOARD ============ -->
    <section class="dash" id="dash-view" hidden>
      <div class="dash__head">
        <div>
          <span class="section__tag">Bienvenida, <strong id="dash-user">nativa</strong></span>
          <h1>Panel de administración</h1>
        </div>
        <button class="btn btn--ghost" id="logout-btn">Cerrar sesión</button>
      </div>

      <div class="dash__stats" id="dash-stats"></div>

      <div class="dash__block">
        <h2>Accesos rápidos</h2>
        <div class="dash__links">
          <a href="index.html">🏠 Ver tienda</a>
          <a href="index.html#catalogo">🛍 Catálogo</a>
          <a href="https://mail.google.com/mail/u/0/" target="_blank" rel="noopener">✉ Abrir correo (peticiones)</a>
        </div>
      </div>

      <div class="dash__block">
        <h2>Catálogo por categoría</h2>
        <div class="dash__cats" id="dash-cats"></div>
      </div>
    </section>

  </main>

  <script src="js/productos.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
